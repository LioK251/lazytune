[package]
name = "lazytune"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "lazytune"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lazytune-model.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "config-toml", "unstable"] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
sha2 = "0.10"
md5 = "0.7"
tempfile = "3"
url = "2"
rfd = "0.16"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
discord-rich-presence = "1.1"
souvlaki = "0.8"
open = "5"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

