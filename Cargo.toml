[workspace]
members = ["crates/model", "crates/ui", "desktop"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lazytune-model = { path = "crates/model" }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[profile.release.package.lazytune-ui]
strip = false

