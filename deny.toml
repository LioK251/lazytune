[advisories]
yanked = "warn"
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste is a transitive Leptos build-time macro; no patched upstream release." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is required by Tauri's GTK3 macros; no patched upstream release." },
  { id = "RUSTSEC-2026-0371", reason = "Tauri and rfd still use zbus 5; zbus_names maintenance moved to zbus 6." },
  { id = "RUSTSEC-2026-0370", reason = "Tauri and rfd still use zbus 5; zvariant maintenance moved to zbus 6." },
  { id = "RUSTSEC-2026-0372", reason = "Tauri and rfd still use zbus 5; zvariant_derive maintenance moved to zbus 6." },
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0", "BSL-1.0", "Unlicense", "OpenSSL"]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
